name: 寺院マップを作成・公開

on:
  # 手動実行(Actions 画面の「Run workflow」ボタン)
  workflow_dispatch:
    inputs:
      region:
        description: "対象地域(空欄なら region.txt の値。例: 群馬県 / 全国)"
        required: false
        default: ""
      continue:
        description: "続きから取得(自動で使います。通常は空欄)"
        required: false
        default: ""
      round:
        description: "続きの回数(自動で使います)"
        required: false
        default: "0"
  # 毎月2日 午前3時(日本時間)にデータを取り直す
  schedule:
    - cron: "17 18 1 * *"
  # サイトのファイルを変えたときは、保存済みデータで作り直すだけ(取り直さない)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 全国のように時間がかかるとき、続きを自動で次の実行に回すため

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      more: ${{ steps.data.outputs.more }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 設定を読む
        id: cfg
        run: |
          REGION="${{ github.event.inputs.region }}"
          if [ -z "$REGION" ]; then REGION="$(head -n1 region.txt | tr -d '\r' | xargs)"; fi
          if [ -z "$REGION" ]; then REGION="全国"; fi
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "key=$(printf '%s' "$REGION" | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then echo "refresh=0" >> "$GITHUB_OUTPUT"; else echo "refresh=1" >> "$GITHUB_OUTPUT"; fi
          echo "対象地域: $REGION"

      - name: 前回取得したデータを復元
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-${{ steps.cfg.outputs.key }}-${{ github.run_id }}
          restore-keys: raw-${{ steps.cfg.outputs.key }}-

      - name: データ取得と統合
        id: data
        env:
          REGION: ${{ steps.cfg.outputs.region }}
          REFRESH: ${{ steps.cfg.outputs.refresh }}
          CONTINUE: ${{ github.event.inputs.continue }}
          BUDGET_MIN: "280"
          ROUND: ${{ github.event.inputs.round || '0' }}
        run: |
          pip install requests openpyxl
          set +e
          python scripts/pipeline.py all
          code=$?
          set -e
          if [ "$code" = "75" ]; then
            echo "more=1" >> "$GITHUB_OUTPUT"
            echo "::notice::データが多いため、続きを次の実行で取得します(サイトは前回の版のまま)"
            exit 0
          fi
          [ "$code" = "0" ] || exit "$code"
          python scripts/population.py
          python scripts/persons.py
          python scripts/enrich.py
          python scripts/seo.py

      - name: 取得したデータを保存(次回の再利用用)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-${{ steps.cfg.outputs.key }}-${{ github.run_id }}

      - name: 続きの取得を予約する
        if: steps.data.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REGION: ${{ steps.cfg.outputs.region }}
          ROUND: ${{ github.event.inputs.round || '0' }}
        run: |
          next=$((ROUND + 1))
          if [ "$next" -gt 8 ]; then echo "::error::8回続けても終わりませんでした。時間をおいて手動で実行してください"; exit 1; fi
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f region="$REGION" -f continue=1 -f round="$next"
          echo "続き(${next}回目)を予約しました"

      - name: 更新がすぐ反映されるようにファイル名に版番号を付ける
        if: steps.data.outputs.more != '1'
        run: sed -i -E 's/(src|href)="([a-z]+\.(js|css))"/\1="\2?v=${{ github.run_id }}"/g' site/index.html

      - uses: actions/configure-pages@v5
        if: steps.data.outputs.more != '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.more != '1'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.more != '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
