name: MCPサーバーを公開(Cloudflare Workers)

on:
  # worker フォルダを変えたとき
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  # 手動実行(Actions 画面の「Run workflow」ボタン)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 準備ができていない場合の案内
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::Cloudflare の鍵(CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID)が未登録のため、MCPサーバーの公開をスキップしました。README の「AIエージェントから使う(MCP)」を見て登録してください。"

      - name: Cloudflare Workers に公開
        if: env.HAS_TOKEN == 'true'
        working-directory: worker
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 貼り付け時に混ざった空白・改行を取り除いてから使う
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"
          case "$CLOUDFLARE_API_TOKEN" in
            *[!A-Za-z0-9_-]*) echo "::error::CLOUDFLARE_API_TOKEN に使えない文字が入っています。Cloudflare のトークンだけをコピーし直して登録してください。"; exit 1;;
          esac
          npx --yes wrangler@4 deploy
